name: Build TWRP Tornado

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          sudo docker system prune -af || true
          df -h

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip \
            python3 python-is-python3 cpio rsync bc lz4

      - name: Install repo
        run: |
          mkdir -p ~/.local/bin
          curl -L https://storage.googleapis.com/git-repo-downloads/repo -o ~/.local/bin/repo
          chmod +x ~/.local/bin/repo
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Initialize TWRP Source
        run: |
          mkdir -p /tmp/twrp
          cd /tmp/twrp
          repo init --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-12.1
          repo sync -c --no-clone-bundle --no-tags -j2

      - name: Copy Device Tree
        run: |
          mkdir -p /tmp/twrp/device/xiaomi/tornado
          rsync -av \
            --exclude=.git \
            --exclude=.github \
            --exclude=.gitignore \
            ./ /tmp/twrp/device/xiaomi/tornado/

      - name: Verify Device Tree
        run: |
          ls -lah /tmp/twrp/device/xiaomi/tornado
          test -f /tmp/twrp/device/xiaomi/tornado/BoardConfig.mk
          test -f /tmp/twrp/device/xiaomi/tornado/AndroidProducts.mk
          test -f /tmp/twrp/device/xiaomi/tornado/omni_tornado.mk

      - name: Build Recovery
        run: |
          cd /tmp/twrp
          source build/envsetup.sh
          lunch omni_tornado-eng

          echo "=== Available targets ==="
          mka -n vendorbootimage || true
          mka -n bootimage || true
          mka -n recoveryimage || true

          echo "=== Building ==="
          mka vendorbootimage || true
          mka bootimage || true
          mka recoveryimage || true

      - name: Debug Output
        if: always()
        run: |
          echo "===== PRODUCT ====="
          find /tmp/twrp/out/target/product -maxdepth 2 -type d || true

          echo "===== IMAGES ====="
          find /tmp/twrp/out -type f \
            \( -name "*.img" -o -name "*.zip" -o -name "*.bin" \) || true

          echo "===== PRODUCT CONTENT ====="
          ls -R /tmp/twrp/out/target/product || true

      - name: Collect Artifacts
        if: always()
        run: |
          mkdir -p /tmp/twrp_upload

          find /tmp/twrp/out \
            -type f \
            \( -name "*.img" -o -name "*.zip" -o -name "*.bin" \) \
            -exec cp {} /tmp/twrp_upload/ \;

          echo "Collected:"
          ls -lah /tmp/twrp_upload || true

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-tornado
          path: /tmp/twrp_upload/
          if-no-files-found: warn
