name: Build TWRP Tornado

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git-core gnupg flex bison build-essential zip curl \
          zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
          lib32ncurses5-dev x11proto-core-dev libx11-dev \
          lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc \
          unzip fontconfig python3 python-is-python3 \
          libssl-dev bc ccache lz4 rsync cpio

    - name: Install Repo
      run: |
        mkdir -p ~/bin
        curl -L https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
        chmod +x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Initialize TWRP Source
      run: |
        mkdir -p /tmp/twrp
        cd /tmp/twrp

        repo init \
          --depth=1 \
          -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
          -b twrp-12.1

        repo sync \
          -c \
          --no-clone-bundle \
          --no-tags \
          -j$(nproc)

    - name: Checkout Tornado Tree
      uses: actions/checkout@v4
      with:
        path: tornado_tree

    - name: Copy Device Tree
      run: |
        mkdir -p /tmp/twrp/device/xiaomi/tornado

        rsync -av \
          --exclude=.git \
          tornado_tree/ \
          /tmp/twrp/device/xiaomi/tornado/

    - name: Verify Device Tree
      run: |
        ls -lah /tmp/twrp/device/xiaomi/tornado
        test -f /tmp/twrp/device/xiaomi/tornado/omni_tornado.mk

    - name: Build TWRP
      run: |
        cd /tmp/twrp

        source build/envsetup.sh

        lunch omni_tornado-eng

        mka recoveryimage vendorbootimage -j$(nproc)

    - name: Debug Build Output
      run: |
        echo "===== PRODUCT DIRECTORY ====="
        ls -lah /tmp/twrp/out/target/product/tornado || true

        echo "===== ALL IMAGES ====="
        find /tmp/twrp/out \
          -type f \
          \( \
          -name "*.img" \
          -o \
          -name "*.zip" \
          \) \
          -ls

    - name: Collect Artifacts
      run: |
        mkdir -p /tmp/twrp_artifacts

        find /tmp/twrp/out \
          -type f \
          \( \
          -name "*.img" \
          -o \
          -name "*.zip" \
          \) \
          -exec cp {} /tmp/twrp_artifacts/ \;

        echo "===== ARTIFACTS ====="
        ls -lah /tmp/twrp_artifacts

        if [ -z "$(ls -A /tmp/twrp_artifacts)" ]; then
          echo "No TWRP images were generated!"
          exit 1
        fi

    - name: Upload TWRP Images
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-tornado
        path: /tmp/twrp_artifacts/*
        if-no-files-found: error
