name: Build TWRP Tornado

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git-core gnupg flex bison build-essential zip curl \
          zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
          lib32ncurses5-dev x11proto-core-dev libx11-dev \
          lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc \
          unzip fontconfig python3 python-is-python3 \
          libssl-dev bc ccache lz4 rsync cpio

    - name: Install Repo
      run: |
        mkdir -p ~/bin
        curl -L https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
        chmod +x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Sync TWRP Source
      run: |
        mkdir -p /tmp/twrp
        cd /tmp/twrp

        repo init \
          -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
          -b twrp-12.1 \
          --depth=1

        repo sync \
          -c \
          --no-clone-bundle \
          --no-tags \
          -j$(nproc)

    - name: Checkout Device Tree
      uses: actions/checkout@v4
      with:
        path: tornado_tree

    - name: Copy Tornado Tree
      run: |
        mkdir -p /tmp/twrp/device/xiaomi/tornado

        cp -a tornado_tree/. /tmp/twrp/device/xiaomi/tornado/

    - name: Check Device Tree
      run: |
        test -f /tmp/twrp/device/xiaomi/tornado/AndroidProducts.mk
        test -f /tmp/twrp/device/xiaomi/tornado/omni_tornado.mk
        test -f /tmp/twrp/device/xiaomi/tornado/BoardConfig.mk

        echo "Device tree OK"

    - name: Build TWRP
      run: |
        cd /tmp/twrp

        source build/envsetup.sh

        lunch omni_tornado-eng

        mka vendorbootimage -j$(nproc)

    - name: Locate Output
      if: always()
      run: |
        echo "Searching generated files..."

        find /tmp/twrp/out \
        -type f \
        \( \
        -name "*.img" \
        -o -name "*.zip" \
        \) \
        -print

    - name: Prepare Artifact
      if: always()
      run: |
        mkdir -p /tmp/twrp_upload

        find /tmp/twrp/out \
        -type f \
        \( \
        -name "*.img" \
        -o -name "*.zip" \
        \) \
        -exec cp {} /tmp/twrp_upload/ \;

        ls -lah /tmp/twrp_upload

    - name: Upload Build
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: tornado-twrp-build
        path: /tmp/twrp_upload/
        if-no-files-found: warn
